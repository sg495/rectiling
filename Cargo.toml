# SPDX-License-Identifier: LGPL-3.0-or-later

[package]
name = "rectiling"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Stefano Gogioso <sg495@users.noreply.github.com>"]
description = "Exact enumeration of tilings of a rectangle by similar rectangles."
license = "LGPL-3.0-or-later"
repository = "https://github.com/sg495/rectiling"
readme = "README.md"
keywords = ["tiling", "rectangles", "combinatorics", "algebraic-numbers"]
categories = ["mathematics", "science"]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1.47"
num-traits = "0.2.19"
rayon = "1.12.0"
smallvec = "1.16.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
